[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reference-tail-trust"
version = "1.0.0"
description = "Internal neural-network adaptation with reference-tail admission and reproducible audits"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  {name = "Abdolvahab Khalili Sadaghiani"},
  {name = "Jose Nunez-Yanez"},
]
keywords = ["graph-neural-networks", "adaptation", "risk-control", "reproducibility"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "torch>=2.5,<3",
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
  "Pillow>=10.3,<13",
  "matplotlib>=3.8,<4",
  "mpmath==1.3.0",
]

[project.optional-dependencies]
data = ["pandas>=2.1,<3", "ogb==1.3.6", "folktables==0.0.12", "tqdm>=4.66,<5"]
image = ["torchvision>=0.20,<0.30"]
dev = ["pytest>=8,<10", "build>=1.2,<2", "setuptools>=68", "wheel"]

[project.scripts]
rtt = "rtt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"rtt.core" = ["README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

